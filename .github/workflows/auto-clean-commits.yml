name: Auto clean old commits (gen-playlist)

on:
  schedule:
    - cron: '0 0 * * *'  # Chạy mỗi ngày lúc 00:00 UTC
  workflow_dispatch:

jobs:
  clean_commits:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Bắt buộc phải lấy full history để lọc ngày

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Keep only last 2 days of history
        run: |
          # 1. Tìm commit đầu tiên được thực hiện cách đây hơn 2 ngày
          # --before="2 days ago" lấy các commit cũ hơn 48h
          # -n 1 lấy cái gần nhất trong số đống cũ đó
          SHRED_COMMIT=$(git rev-list -n 1 --before="2 days ago" main)

          if [ -z "$SHRED_COMMIT" ]; then
            echo "Lịch sử commit chưa đủ 2 ngày, bỏ qua việc dọn dẹp."
            exit 0
          fi

          echo "Dọn dẹp các commit trước: $SHRED_COMMIT"

          # 2. Tạo một commit gốc mới từ trạng thái của 2 ngày trước
          # Phương pháp này sẽ gộp toàn bộ các commit cũ thành 1 commit 'Initial' 
          # và giữ nguyên các commit lẻ của 2 ngày gần đây.
          git checkout --orphan temp_branch $SHRED_COMMIT
          git commit -m "chore: archive history older than 2 days"
          
          # 3. Chèn các commit mới (2 ngày qua) lên trên commit gốc mới này
          git rebase --onto temp_branch $SHRED_COMMIT main
          
          # 4. Push đè lên remote
          git push -f origin main
