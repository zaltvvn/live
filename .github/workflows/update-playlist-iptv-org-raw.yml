name: Update M3U Playlist Link IPTV-ORG-RAW

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  export-playlist-virtual:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo engine
        uses: actions/checkout@v4
        with:
          repository: zaltvvn/engine
          path: engine
          token: ${{ secrets.ENGINE_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 🟢 1. LẤY NGÀY HIỆN TẠI ĐỂ LÀM KEY CACHE
      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # 🟢 2. CẤU HÌNH CACHE THEO NGÀY
      - name: Cache JSON logos
        uses: actions/cache@v4
        with:
          path: |
            *.json
          key: iptv-logos-cache-raw-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            iptv-logos-cache-raw-${{ runner.os }}-

      - name: Chạy Script xử lý M3U
        run: |
          pip install requests
          python engine/playlist_iptv_org_raw.py

      - name: Deploy lên nhánh ảo playlist
        run: |
          mkdir temp_deploy

          # Copy CẢ 2 FILE vào thư mục rỗng
          cp index.m3u temp_deploy/index.m3u
          cp index_uncheck.m3u temp_deploy/index_uncheck.m3u

          cd temp_deploy

          git init -b iptv-org-raw
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add và Commit 2 file
          git add index.m3u index_uncheck.m3u
          git commit -m "🔄 Tự động cập nhật playlist (bản check link và không check)"

          git remote add origin https://${{ secrets.ENGINE_TOKEN }}@github.com/zaltvvn/live.git
          git push origin iptv-org-raw --force
