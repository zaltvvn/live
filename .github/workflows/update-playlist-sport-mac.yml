name: Sync M3U Sports Mac Playlist

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi để push nhánh mới

    steps:
      # 1. Checkout repo (không fix cứng nhánh nữa)
      - name: Checkout live repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quan trọng: Kéo toàn bộ lịch sử nhánh về để rẽ nhánh không bị lỗi

      # 2. Checkout repo private chứa script
      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          repository: zaltvvn/engine
          path: engine
          token: ${{ secrets.ENGINE_TOKEN }}

      # 3. Cài đặt Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      # 4. Cài đặt thư viện
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp

      # 5. Chạy script (Nó sẽ tạo ra file playlist.m3u)
      - name: Run playlist Sports Mac engine
        run: |
          python engine/sports_mac.py

      # 6. Xử lý Git: Tự tạo nhánh và Push
      - name: Commit and push generated playlist Sports Mac
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Bước đột phá: Di chuyển file m3u vừa tạo ra ngoài thư mục làm việc để Git không cản đường
          mv sports_mac.m3u ../sports_mac_temp.m3u
          
          # Xóa thư mục mã nguồn private (engine)
          rm -rf engine
          
          # Kéo thông tin nhánh m3u từ server về (nếu nhánh đã tồn tại)
          git fetch origin m3u || true
          
          # Chuyển sang nhánh m3u một cách an toàn. Nếu chưa có thì tự tạo mới (-b)
          git checkout m3u || git checkout -b m3u
          
          # Chép file m3u mới (đang giấu) đè lên lại thư mục hiện tại của nhánh m3u
          mv ../sports_mac_temp.m3u sports_mac.m3u
          
          # Cập nhật Git
          git add sports_mac.m3u
          
          # Kiểm tra nếu có thay đổi thì commit và push
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update playlist"
            git push origin m3u
          fi
