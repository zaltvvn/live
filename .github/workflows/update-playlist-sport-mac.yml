name: Sync M3U Sports Mac Playlist

on:
  schedule:
    - cron: '0 */2 * * *' # Chạy mỗi 2 tiếng
  workflow_dispatch:

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout repo đích (nhánh chính hoặc bất kỳ)
      - name: Checkout live repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Checkout repo private chứa script (Cần ENGINE_TOKEN)
      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          repository: zaltvvn/engine
          path: engine
          token: ${{ secrets.ENGINE_TOKEN }}

      # 3. Cài đặt Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      # 4. CÀI ĐẶT FFmpeg (BẮT BUỘC ĐỂ SOI CHẤT LƯỢNG KÊNH)
      - name: Install FFmpeg & ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 5. Cài đặt thư viện Python (Chỉ cần aiohttp cho bản mới nhất)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      # 6. Chạy script tạo playlist (Deep Scan mode)
      - name: Run playlist Sports Mac engine
        run: |
          python engine/sports_mac.py

      # 7. Xử lý Git: Switch nhánh m3u và Push kết quả
      - name: Commit and push generated playlist Sports Mac
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Cất file m3u mới tạo ra vùng an toàn
          mv sports_mac.m3u ../sports_mac_temp.m3u
          
          # Xóa mã nguồn private
          rm -rf engine
          
          # Chuẩn bị nhánh m3u
          git fetch origin m3u || true
          git checkout m3u || git checkout -b m3u
          
          # Mang file m3u trở lại thư mục làm việc
          mv ../sports_mac_temp.m3u sports_mac.m3u
          
          git add sports_mac.m3u
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update quality playlist with ffprobe Deep Scan"
            git push origin m3u
          fi
