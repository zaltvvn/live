name: Sync M3U Sports Mac Playlist

on:
  schedule:
    - cron: '0 */2 * * *' # Chạy mỗi 2 tiếng
  workflow_dispatch:

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout live repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          repository: zaltvvn/engine
          path: engine
          token: ${{ secrets.ENGINE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      # QUAN TRỌNG: Cài FFmpeg để đo chất lượng UHD/FHD/HD
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run playlist Sports Mac engine
        run: |
          python engine/sports_mac.py

      - name: Commit and push generated playlist Sports Mac
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          rm -rf engine
          git fetch origin m3u || true
          git checkout m3u || git checkout -b m3u
          git add sports_mac.m3u
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update quality playlist with ffprobe"
            git push -u origin m3u
          fi
