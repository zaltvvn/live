name: ▶️ EPG Grabber

on:
  schedule:
    # Giờ UTC = Giờ VN + 7
    - cron: "15 16 * * *" # ~23:15 VN
    - cron: "11 02 * * *" # ~09:11 VN
    - cron: "21 07 * * *" # ~14:21 VN 
    - cron: "15 14 * * *" # ~21:15 VN
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  epg-grabber:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout live repo
        uses: actions/checkout@v4

      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          repository: zaltvvn/engine
          path: engine
          token: ${{ secrets.ENGINE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5 # Đã nâng cấp lên v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run EPG engine
        run: |
          python engine/Backup/epg-grabber.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Thêm epg.xml và epg.xml.gz
          git add epg.xml epg.xml.gz

          if git diff --staged --quiet; then
            echo "No changes"
          else
            # 🟢 Ép múi giờ VN cho lệnh date để log commit hiển thị chuẩn giờ thực tế
            git commit -m "🔄 Update EPG: $(TZ='Asia/Ho_Chi_Minh' date +'%d/%m %H:%M')"
            git push
          fi
