name: ▶️ EPG Grabber

on:
  schedule:
    - cron: "15 16 * * *" # ~23:15 VN
    - cron: "11 02 * * *" # ~09:11 VN
    - cron: "35 07 * * *" # ~14:35 VN 
    - cron: "25 14 * * *" # ~21:25 VN
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  epg-grabber:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout live repo
        uses: actions/checkout@v4

      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          repository: zaltvvn/engine
          path: engine
          token: ${{ secrets.ENGINE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run EPG engine
        run: |
          python engine/Backup/epg-grabber.py

      - name: Commit and push changes to epg-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Chuyển sang một nhánh ảo để chứa dữ liệu
          git checkout --orphan epg-branch
          git rm -rf --cached .
          
          # Chỉ gom các file EPG và CNAME
          git add epg.xml epg.xml.gz CNAME
          
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "🔄 Update EPG: $(TZ='Asia/Ho_Chi_Minh' date +'%d/%m %H:%M')"
            # Đẩy file sang nhánh 'epg-data' (nhánh này sẽ tự động xóa file cũ, chỉ giữ file mới nhất)
            git push -f origin epg-branch:epg-data
          fi
